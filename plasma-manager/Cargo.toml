[package]
name = "plasma-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
etcetera = "0.8.0"
indexmap = "2.10.0"
kconfig-rs = { path = "./kconfig-rs" }
regex = "1.10.5"
ron = "0.10.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
tabled = "0.18.0"
toml = "0.9.2"

[workspace]
members = [
  ".",
  "kconfig-rs"
]
